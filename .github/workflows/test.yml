name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm --network none --mount "type=bind,source=${{ github.workspace }},target=/mnt,readonly" koalaman/shellcheck:stable --external-sources --source-path=SCRIPTDIR cs2monitor.sh tests/unit.sh tests/integration.sh
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ['debian:12-slim', 'debian:13-slim', 'ubuntu:24.04', 'archlinux:base', 'fedora:latest', 'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BASE=${{ matrix.base }} -f tests/Dockerfile -t cs2-linux-test .
      - run: docker run --rm --network none cs2-linux-test
      - run: docker run --rm --network none --cap-add NET_ADMIN -e CS2_DISPOSABLE_NETWORK=yes cs2-linux-test bash tests/integration.sh
